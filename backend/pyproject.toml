[project]
name = "a-little-universe-backend"
version = "0.1.0"
description = "Minimal optional API for A Little Universe for You"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0,<1",
    "pydantic>=2.14.1,<3",
    "python-dotenv>=1.2.4,<2",
    "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16.0,<3",
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
